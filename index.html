<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO: descrição que aparece em buscadores -->
    <meta
      name="description"
      content="Portfólio de Daniel Tsuruga, estudante de Engenharia de Software na PUC Minas. Projetos, experiências e formas de contato."
    />
    <meta name="author" content="Daniel Tsuruga" />

    <!-- Open Graph: prévia ao compartilhar o link (LinkedIn, WhatsApp, etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Daniel Tsuruga — Portfólio" />
    <meta
      property="og:description"
      content="Estudante de Engenharia de Software na PUC Minas. Veja meus projetos, experiências e entre em contato."
    />
    <meta property="og:url" content="https://danieltsuruga-portifolio.vercel.app/" />
    <meta property="og:image" content="https://danieltsuruga-portifolio.vercel.app/og-image.png" />
    <meta property="og:locale" content="pt_BR" />

    <!-- Twitter/X: usa um formato próprio de prévia -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Daniel Tsuruga — Portfólio" />
    <meta
      name="twitter:description"
      content="Estudante de Engenharia de Software na PUC Minas. Projetos, experiências e contato."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Fontes do projeto:
      - Archivo: títulos (pesos 600, 700, 800)
      - Inter Tight: texto corrido / navegação (pesos 400, 500)
      - JetBrains Mono: rótulos e detalhes técnicos (pesos 400, 500)
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Inter+Tight:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <title>Daniel Tsuruga — Portfólio</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
